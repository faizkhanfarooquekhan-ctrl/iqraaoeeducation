<style>
  :root {
    --bg: #07060f;
    --ink: #f7f2ff;
    --muted: #b7adc9;
    --line: rgba(255, 255, 255, 0.14);
    --glass: rgba(16, 12, 32, 0.62);
    --violet: #a78bfa;
    --pink: #f472b6;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: Outfit, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 0% -10%, rgba(109, 40, 217, 0.45), transparent 55%),
      radial-gradient(800px 480px at 100% 0%, rgba(219, 39, 119, 0.28), transparent 50%),
      radial-gradient(700px 500px at 50% 110%, rgba(14, 165, 233, 0.16), transparent 50%),
      var(--bg);
    background-attachment: fixed;
  }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  img { max-width: 100%; }

  #particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .orb {
    position: fixed;
    z-index: 0;
    width: 280px;
    height: 280px;
    border-radius: 999px;
    filter: blur(40px);
    opacity: 0.45;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite;
  }
  .orb-a { top: -80px; left: -60px; background: #6d28d9; }
  .orb-b { right: -80px; bottom: -80px; background: #be185d; animation-delay: -6s; }
  .orb-c { top: 40%; left: 45%; background: #0ea5e9; opacity: 0.2; animation-delay: -12s; }

  .app {
    position: relative;
    z-index: 1;
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 48px;
  }
  .view { animation: rise 0.55s var(--ease); }
  .hidden { display: none !important; }

  .glass {
    background: linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
  }
  .login-wrap {
    min-height: calc(100vh - 76px);
    display: grid;
    place-items: center;
  }
  .login-card { width: min(480px, 100%); padding: 42px 36px; border-radius: 32px; text-align: center; position: relative; overflow: hidden; }
  .crest {
    width: 84px; height: 84px; margin: 0 auto 16px;
    border-radius: 28px;
    display: grid; place-items: center;
    font-weight: 800; letter-spacing: 0.08em;
    background: linear-gradient(145deg, rgba(167,139,250,0.3), rgba(244,114,182,0.18));
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 10px 40px rgba(167,139,250,0.35), inset 0 0 20px rgba(255,255,255,0.08);
  }
  .gradient-text {
    background: linear-gradient(100deg, #c4b5fd, #f9a8d4 45%, #fb7185);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1, h2, h3, p { margin: 0; }
  .eyebrow { letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); font-size: 12px; font-weight: 600; }
  .lede { color: var(--muted); margin-top: 8px; }

  .stack { display: grid; gap: 14px; text-align: left; margin-top: 28px; }
  .field { position: relative; }
  .field i {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: #c4b5fd; width: 18px; text-align: center;
  }
  .field input, .field select, .bare-input {
    width: 100%;
    background: rgba(0,0,0,0.35);
    color: white;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 16px;
    padding: 16px 16px 16px 46px;
    font-size: 16px;
    outline: none;
    transition: border-color .25s, box-shadow .25s;
  }
  .bare-input { padding-left: 16px; }
  .field select { appearance: none; }
  .field input:focus, .field select:focus, .bare-input:focus {
    border-color: #a78bfa;
    box-shadow: 0 0 0 4px rgba(167,139,250,0.18);
  }
  .ghost-eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: transparent; border: 0; color: var(--muted); padding: 8px;
  }
  label.lbl { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }

  .btn {
    border: 0; border-radius: 16px; padding: 14px 18px;
    font-weight: 700; letter-spacing: 0.04em;
    transition: transform .25s var(--ease), box-shadow .25s, background .25s;
  }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn-primary {
    color: white;
    background: linear-gradient(100deg, #7c3aed, #db2777 55%, #f97316);
    background-size: 160% 100%;
    box-shadow: 0 12px 30px rgba(219, 39, 119, 0.28);
  }
  .btn-primary:hover { background-position: 100% 0; transform: translateY(-2px); }
  .btn-ghost {
    color: var(--ink);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.12); }
  .btn-danger { background: rgba(244,63,94,0.16); color: #fecdd3; border: 1px solid rgba(244,63,94,0.45); }
  .btn[disabled] { opacity: 0.55; cursor: not-allowed; transform: none; }
  .full { width: 100%; }

  .topbar, .section-head {
    display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap;
  }
  .topbar h2 { font-size: clamp(26px, 4vw, 32px); line-height: 1.25; overflow-wrap: anywhere; }
  .brand-lockup { display: flex; gap: 12px; align-items: center; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; font-weight: 800;
    background: rgba(167,139,250,0.16); border: 1px solid rgba(167,139,250,0.4);
  }
  .stat-grid, .module-grid, .admin-layout, .choice-grid, .video-grid {
    display: grid; gap: 16px; margin-top: 22px;
  }
  .stat-grid { grid-template-columns: repeat(4, 1fr); }
  .module-grid, .choice-grid { grid-template-columns: repeat(2, 1fr); }
  .admin-layout { grid-template-columns: 320px 1fr; align-items: start; }
  .video-grid { grid-template-columns: 1fr 1fr; }
  .stat, .module-card, .choice-card, .panel {
    border-radius: 24px; padding: 20px;
  }
  .stat strong { display: block; font-size: 28px; margin-top: 4px; }
  .stat span, .muted { color: var(--muted); }
  .module-card, .choice-card {
    text-align: left; color: inherit;
    background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    transition: transform .45s var(--ease), border-color .3s, box-shadow .3s;
    transform: perspective(900px) translateY(0);
  }
  .module-card:hover, .choice-card:hover {
    transform: perspective(900px) rotateX(5deg) translateY(-8px) scale(1.015);
    border-color: rgba(244,114,182,0.55);
    box-shadow: 0 22px 40px rgba(219,39,119,0.18);
  }
  .icon-bubble {
    width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center;
    font-size: 28px; margin-bottom: 14px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  }
  .nastaliq { font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.9; }
  .devanagari { font-family: 'Noto Sans Devanagari', Outfit, sans-serif; }

  .team { margin-top: 54px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; }
  .team-kicker { color: var(--muted); letter-spacing: 0.08em; font-size: 13px; }
  .portraits { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; margin: 28px 0; }
  .person { width: 150px; }
  .portrait {
    width: 112px; height: 112px; margin: 0 auto 10px; border-radius: 999px; padding: 4px;
    background: linear-gradient(140deg, rgba(167,139,250,0.9), rgba(244,114,182,0.2));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 0 24px rgba(167,139,250,0.45);
    transition: transform .35s var(--ease);
  }
  .person:hover .portrait { transform: translateY(-6px) scale(1.05); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px; background: #1e1633; }
  .role { color: #c4b5fd; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
  .copyright {
    margin-top: 8px; padding: 14px; border-radius: 16px;
    background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.08); color: var(--muted);
  }
  .glow-pink { background: linear-gradient(140deg, #f472b6, rgba(255,255,255,0.2)); box-shadow: 0 0 24px rgba(244,114,182,0.45); }
  .glow-blue { background: linear-gradient(140deg, #60a5fa, rgba(255,255,255,0.2)); box-shadow: 0 0 24px rgba(96,165,250,0.45); }
  .glow-green { background: linear-gradient(140deg, #34d399, rgba(255,255,255,0.2)); box-shadow: 0 0 24px rgba(52,211,153,0.45); }

  .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .linkish { background: transparent; border: 0; color: var(--muted); font-weight: 600; padding: 0; }
  .linkish:hover { color: white; }
  .word-grid, .option-grid, .table-picks { display: grid; gap: 12px; }
  .word-grid { grid-template-columns: 1fr 1fr; }
  .option-grid { grid-template-columns: 1fr 1fr; margin-top: 8px; }
  .word-card, .option-btn {
    position: relative;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px;
    color: white;
    padding: 22px 16px;
    text-align: center;
    transition: transform .3s var(--ease), border-color .3s, background .3s;
  }
  .word-card:hover, .option-btn:hover { transform: translateY(-4px); border-color: rgba(167,139,250,0.7); }
  .word-card .term { font-size: 40px; font-weight: 800; }
  .word-card .gloss { color: #f9a8d4; margin-top: 6px; font-weight: 600; }
  .speak {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 999px;
    border: 0; background: rgba(255,255,255,0.1); color: white;
  }
  .option-btn { font-size: 22px; font-weight: 800; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .option-btn .key { color: #a78bfa; }
  .option-btn.good { background: rgba(16,185,129,0.22); border-color: rgba(16,185,129,0.7); }
  .option-btn.bad { background: rgba(244,63,94,0.2); border-color: rgba(244,63,94,0.7); }
  .prompt {
    font-size: clamp(32px, 5vw, 56px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.15;
  }
  .hud {
    display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 14px; border-radius: 20px; margin-bottom: 14px;
  }
  .pill { border-radius: 999px; padding: 8px 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); font-weight: 700; }
  .pill.xp { color: #fde68a; border-color: rgba(250,204,21,0.4); }
  .pill.practice { color: #bfdbfe; border-color: rgba(59,130,246,0.45); }
  .pill.test { color: #fecdd3; border-color: rgba(244,63,94,0.5); animation: pulse 1.6s infinite; }
  .feedback { min-height: 36px; margin-top: 16px; font-size: 20px; font-weight: 800; }
  .report-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 20px 0; }
  .report-grid div { border-radius: 18px; padding: 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .table-picks { grid-template-columns: repeat(10, 1fr); }
  .table-picks button, .mini {
    border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: white; font-weight: 800; min-height: 42px;
  }
  .table-picks button.active { background: rgba(16,185,129,0.35); border-color: #34d399; }
  .table-lines { display: grid; gap: 8px; margin-top: 18px; font-size: 22px; }
  .table-lines button { background: transparent; border: 0; color: white; font-weight: 700; font-size: 22px; }

  .student-list { display: grid; gap: 10px; }
  .student-card {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
    padding: 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
  }
  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
  .badge.live { background: rgba(16,185,129,0.18); color: #a7f3d0; }
  .badge.dead { background: rgba(244,63,94,0.18); color: #fecdd3; }
  .row-actions { display: flex; gap: 8px; }
  .search { margin: 12px 0; }

  .modal-back, .busy {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: rgba(4, 3, 10, 0.62); backdrop-filter: blur(8px); padding: 20px;
  }
  .modal { width: min(480px, 100%); padding: 24px; border-radius: 24px; }
  .busy { z-index: 50; }
  .spinner {
    width: 46px; height: 46px; border-radius: 999px;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: #f9a8d4;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px;
  }
  #toasts {
    position: fixed; top: 92px; right: 16px; z-index: 60; pointer-events: none;
    display: grid; gap: 10px; width: min(320px, calc(100% - 32px));
  }
  .field input::placeholder, .bare-input::placeholder { color: rgba(255,255,255,0.38); }
  .toast {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
    background: rgba(12, 10, 22, 0.92); box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    transform: translateX(16px); opacity: 0; animation: slide .35s var(--ease) forwards;
  }
  .frame {
    background: rgba(0,0,0,0.28); border: 1px solid var(--line); border-radius: 28px; padding: 22px;
  }
  iframe { width: 100%; height: 230px; border: 0; border-radius: 18px 18px 0 0; background: black; }
  .video-card { overflow: hidden; padding: 0; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); }
  .video-card p { padding: 12px 14px 16px; }
  .xp-float {
    position: fixed; z-index: 45; color: #fde68a; font-weight: 800; pointer-events: none;
    animation: floatup 0.9s var(--ease) forwards;
  }
  .warn { color: #fde68a; font-size: 14px; margin-top: 8px; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes drift { 50% { transform: translateY(24px) scale(1.08); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { to { transform: none; opacity: 1; } }
  @keyframes floatup { to { transform: translateY(-46px); opacity: 0; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(244,63,94,0.12); } }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 99px; }

  @media (max-width: 900px) {
    .stat-grid, .admin-layout, .video-grid, .report-grid { grid-template-columns: 1fr 1fr; }
    .admin-layout { grid-template-columns: 1fr; }
    .table-picks { grid-template-columns: repeat(5, 1fr); }
  }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 680px) {
    #toasts { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; }
    .stat-grid, .module-grid, .choice-grid, .word-grid, .option-grid, .video-grid, .report-grid, .cols-3 { grid-template-columns: 1fr; }
    .login-card { padding: 28px 18px; }
    .app { width: min(1120px, calc(100% - 20px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
